[build]
  functions = "netlify/functions"
  publish   = "."

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18"

# Route tsb subdomain to /tsb/ page
[[redirects]]
  from = "https://tsb.phonepop5.virtualautomotiv.com/*"
  to   = "/tsb/:splat"
  status = 200
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
